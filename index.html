<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Scorebug</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=block" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%}
body.bgimg{background:#000 center/cover no-repeat}
#stage{position:absolute;left:0;top:0;width:3840px;height:2160px;transform-origin:0 0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;color:#fff}
.abs{position:absolute}
.t{position:absolute;white-space:nowrap;line-height:1}
/* bar (3840 canvas, bar strip top = 1840) */
#bar{position:absolute;left:0;top:1840px;width:3840px;height:310px;opacity:0;transition:opacity .5s}
#bar.on{opacity:1}
#shadow{left:110px;top:20px;width:3620px;height:242px;box-shadow:0 0 34px 10px rgba(0,0,0,.45);background:rgba(0,0,0,.25)}
#ticker{left:110px;top:200px;width:3620px;height:62px}

#tgt{left:1982px;top:20px;width:362px;height:180px;background:linear-gradient(90deg,rgb(246,196,40),rgb(236,176,30));clip-path:polygon(34px 0,100% 0,calc(100% - 34px) 100%,0 100%)}

.ball{position:absolute;top:76px;width:76px;height:76px;border-radius:50%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:46px;color:rgb(20,24,40);padding-top:4px}
.ball.empty{border:5px solid rgba(255,255,255,.9)}
.ball.dot{border:5px solid rgba(255,255,255,.9)}
.ball.dot::after{content:"";width:18px;height:18px;border-radius:50%;background:#fff;margin-top:-4px}

/* flyer */
#fly{position:absolute;left:0;top:1270px;width:3840px;height:600px;pointer-events:none}
.fpart{position:absolute;will-change:transform;transform:translateX(-5000px)}
#band{left:460px;top:0;width:2920px;height:340px}
#bandfill{position:absolute;left:0;top:20px;width:2920px;height:300px;clip-path:polygon(120px 0,100% 0,2800px 100%,0 100%)}
.gold{position:absolute;height:12px;background:rgb(222,176,64)}
#word{left:0;top:20px;width:3840px;height:300px;display:flex;align-items:center;justify-content:center}
#wordtxt{font-weight:700;font-size:280px;line-height:1;transform:skewX(-12deg);text-shadow:8px 10px 16px rgba(0,0,0,.6);padding-top:20px}
#sub{left:250px;top:-226px;display:flex;justify-content:flex-start}
#fly.subdown #sub{left:0;top:356px;width:3840px;justify-content:center}
#plate{background:rgba(10,14,26,.92);border-radius:18px;padding:16px 60px 18px 60px;position:relative;overflow:hidden}
#plate::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:rgb(222,176,64)}
#l1{font-weight:700;font-size:76px;line-height:1.05;white-space:pre}
#l2{font-weight:600;font-size:52px;line-height:1.1;color:rgb(222,176,64);white-space:pre}
.logo{position:absolute;top:44px;width:132px;height:132px;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.85),0 6px 14px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:54px;padding-top:4px;box-sizing:border-box}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
#tick{transition:opacity .45s}
.ph{position:absolute;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.85),0 6px 14px rgba(0,0,0,.35);padding-top:4px;box-sizing:border-box}
.ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:center 22%}
#plate{display:flex;align-items:center;gap:40px}
#plate .ph{position:relative;flex:none}
.big{top:-30px;width:360px;height:420px}
.big .ph{position:absolute;left:0;top:0;box-shadow:0 0 0 10px rgb(222,176,64),0 14px 34px rgba(0,0,0,.55)}
.big .lg{position:absolute;left:20px;top:20px;width:320px;height:320px;border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 0 0 10px rgb(222,176,64),0 14px 34px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:110px}
.big .lg img{width:100%;height:100%;object-fit:cover}
.big .tag{position:absolute;left:50%;top:318px;transform:translateX(-50%);white-space:nowrap;font-weight:700;font-size:50px;padding:10px 30px 6px;border-radius:12px;background:rgb(12,14,22);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.big .tag.red{background:rgb(215,30,45)}
.big .tag.gold{background:rgb(240,190,40);color:rgb(20,16,6)}
#balltray{position:absolute;top:66px;height:96px;border-radius:48px;background:rgba(6,8,14,.62);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
/* LIVE bug */
#bug{position:absolute;left:110px;top:90px;display:none;align-items:stretch;height:96px;font-weight:700}
body.bugon #bug{display:flex}
#bug .live{background:rgb(215,30,45);padding:0 30px;display:flex;align-items:center;font-size:52px;letter-spacing:2px;padding-top:4px}
#bug .live i{width:22px;height:22px;border-radius:50%;background:#fff;margin-right:16px;margin-top:-4px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
#bug .ser{background:rgba(8,10,18,.45);text-shadow:0 3px 10px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.9);padding:0 34px;display:flex;align-items:center;font-size:48px;font-weight:600;padding-top:4px}
#bug .ser b{color:rgb(222,176,64);font-weight:700;margin-left:22px}
#bug img{height:72px;width:72px;border-radius:12px;object-fit:cover;background:#fff;margin:0 10px}
/* glass style (see-through) */
body.glass #batside{background:linear-gradient(90deg,rgba(8,10,18,.55),rgba(8,10,18,.40));box-shadow:inset 0 10px 0 var(--batc)}
body.glass #bowlside{background:linear-gradient(90deg,rgba(8,10,18,.40),rgba(8,10,18,.55))!important;box-shadow:inset 0 10px 0 var(--bowlc)}
body.glass #tgt{background:rgba(8,10,18,.50);box-shadow:inset 0 10px 0 rgb(222,176,64)}
body.glass #tlab,body.glass #tval{color:rgb(246,200,60)!important}
body.glass #ticker{background:rgba(6,8,14,.62)!important}
body.glass #shadow{background:transparent;box-shadow:none}
body.glass #bar .t{text-shadow:0 3px 10px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.9)}
/* compact style */
#cbar{position:absolute;left:110px;top:1960px;width:3620px;height:132px;display:none;align-items:stretch;font-weight:700;box-shadow:0 8px 28px rgba(0,0,0,.45);opacity:0;transition:opacity .5s}
#cbar.on{opacity:1}
body.compact #bar{display:none} body.compact #cbar{display:flex}
#cbar>div{display:flex;align-items:center;white-space:nowrap}
#cbar .cteam{padding:0 34px 0 18px;gap:24px}
#cbar .clogo{width:104px;height:104px;border-radius:14px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;font-size:44px}
#cbar .clogo img{width:100%;height:100%;object-fit:cover}
#cbar .cscore{font-size:96px;padding-top:6px}
#cbar .cov{font-size:48px;font-weight:600;color:rgb(215,215,222);padding-top:14px}
#cbar .cbat{background:rgba(14,16,24,.88);flex:1;padding:0 30px;gap:56px;font-size:50px;font-weight:600}
#cbar .cbat span.r{font-weight:700;font-size:60px;margin-left:16px}
#cbar .cbat span.b{font-weight:500;color:rgb(190,195,210);font-size:44px;margin-left:10px}
#cbar .cbowl{padding:0 30px;gap:18px;font-size:50px;font-weight:600}
#cbar .cbowl .f{font-size:60px;font-weight:700}
#cbar .cballs{gap:14px;padding:0 26px}
#cbar .cballs .ball{position:relative;top:0;width:64px;height:64px;font-size:38px}
#cbar .ceq{background:linear-gradient(90deg,rgb(246,196,40),rgb(236,176,30));color:rgb(20,16,6);padding:0 40px;font-size:54px}
body.compact #fly{top:1360px}
#nb{position:absolute;left:110px;top:1420px;width:2300px;height:410px;overflow:hidden;pointer-events:none}

#nb.on #nbin{transform:translateY(-410px)}
#nbin .card{position:absolute;left:0;top:30px;width:2300px;height:370px;background:linear-gradient(90deg,rgba(14,16,26,.96),rgba(30,32,44,.94));border-radius:22px;box-shadow:0 14px 36px rgba(0,0,0,.5);overflow:hidden}

#nbin .tag.bowl{background:rgb(60,160,255);color:#fff}
#nbin .nm{position:absolute;left:300px;top:130px;font-weight:700;font-size:92px;line-height:1;white-space:nowrap;transform-origin:0 50%}
#nbin .tmr{position:absolute;left:300px;top:236px;display:flex;align-items:center;gap:16px}
#nbin .lg{width:64px;height:64px;border-radius:10px;overflow:hidden;background:#fff;flex:none}
#nbin .lg img{width:100%;height:100%;object-fit:cover}
#nbin .tm{font-weight:600;font-size:40px;color:rgb(200,204,216);white-space:nowrap;padding-top:4px}
#nbin .grid{position:absolute;left:910px;top:34px;display:grid;grid-template-columns:240px repeat(8,124px);column-gap:8px;row-gap:10px;align-items:center}
#nbin .grid .h{font-size:28px;font-weight:600;color:rgb(222,176,64);letter-spacing:1px;text-align:center;white-space:nowrap}
#nbin .grid .rl{font-size:34px;font-weight:700;color:rgb(222,176,64);letter-spacing:1px;white-space:nowrap;padding-top:6px}
#nbin .grid .v{font-size:54px;font-weight:700;text-align:center;background:rgba(255,255,255,.06);border-radius:12px;padding:12px 0 6px;line-height:1}
#nbin .grid .v.mut{color:rgb(150,155,170)}
body.compact #nb{top:1540px}
#opin .card{position:absolute;left:0;top:30px;width:2300px;height:370px;background:linear-gradient(90deg,rgba(14,16,26,.96),rgba(30,32,44,.94));border-radius:22px;box-shadow:0 14px 36px rgba(0,0,0,.5);overflow:hidden}
#opin .accent{position:absolute;left:0;top:0;bottom:0;width:16px}
#opin .ph{left:46px;top:75px;box-shadow:0 0 0 6px rgb(222,176,64),0 8px 20px rgba(0,0,0,.45)}
#opin .tag{position:absolute;left:300px;top:70px;font-weight:700;font-size:40px;letter-spacing:3px;color:rgb(20,16,6);background:rgb(240,190,40);padding:6px 20px 2px;border-radius:8px}
#opin .tag.bowl{background:rgb(60,160,255);color:#fff}
#opin .nm{position:absolute;left:300px;top:130px;font-weight:700;font-size:92px;line-height:1;white-space:nowrap;transform-origin:0 50%}
#opin .tmr{position:absolute;left:300px;top:236px;display:flex;align-items:center;gap:16px}
#opin .lg{width:64px;height:64px;border-radius:10px;overflow:hidden;background:#fff;flex:none}
#opin .lg img{width:100%;height:100%;object-fit:cover}
#opin .tm{font-weight:600;font-size:40px;color:rgb(200,204,216);white-space:nowrap;padding-top:4px}
#opin .grid{position:absolute;left:910px;top:34px;display:grid;grid-template-columns:240px repeat(8,124px);column-gap:8px;row-gap:10px;align-items:center}
#opin .grid .h{font-size:28px;font-weight:600;color:rgb(222,176,64);letter-spacing:1px;text-align:center;white-space:nowrap}
#opin .grid .rl{font-size:34px;font-weight:700;color:rgb(222,176,64);letter-spacing:1px;white-space:nowrap;padding-top:6px}
#opin .grid .v{font-size:54px;font-weight:700;text-align:center;background:rgba(255,255,255,.06);border-radius:12px;padding:12px 0 6px;line-height:1}
#opin .grid .v.mut{color:rgb(150,155,170)}
#op{position:absolute;left:110px;top:1020px;width:2300px;height:820px;pointer-events:none;opacity:0;transform:translateY(40px);transition:opacity .5s,transform .55s cubic-bezier(.22,1,.36,1)}
#op.on{opacity:1;transform:none}
#opin .slot{position:absolute;left:0;width:2300px;height:410px}
body.compact #op{top:1140px}
#wait{position:absolute;left:0;top:1840px;width:3840px;height:310px;display:none}
body.waiting #wait{display:block}
#wait>div{position:absolute}
#wait .wsh{left:110px;top:20px;width:3620px;height:242px;box-shadow:0 0 34px 10px rgba(0,0,0,.45);background:rgba(0,0,0,.25)}
#wait .wl{left:110px;top:20px;width:1900px;height:180px;background:linear-gradient(90deg,rgb(30,30,34),rgb(66,56,46));clip-path:polygon(0 0,100% 0,calc(100% - 34px) 100%,0 100%);padding:16px 0 0 70px;box-sizing:border-box}
#wait .wk{font-weight:700;font-size:44px;letter-spacing:4px;color:rgb(246,200,60);display:flex;align-items:center;gap:22px}
#wait .wdot{width:26px;height:26px;border-radius:50%;background:rgb(225,40,55);animation:wpulse 1.4s ease-in-out infinite}

#wait .wm{font-weight:700;font-size:92px;line-height:1;margin-top:8px;white-space:nowrap;color:#fff}
#wait .wg{left:1982px;top:20px;width:362px;height:180px;background:linear-gradient(90deg,rgb(246,196,40),rgb(236,176,30));clip-path:polygon(34px 0,100% 0,calc(100% - 34px) 100%,0 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgb(20,16,6)}

#nbin .card.ns,#opin .card.ns{width:1150px}
#win,#fh{transition:opacity .3s}
body.flyon #win,body.flyon #fh,body.nbon #win,body.opon #win{opacity:0}
#msg{position:absolute;left:110px;top:60px;font:600 40px "Barlow Condensed",sans-serif;background:rgba(0,0,0,.6);padding:10px 20px;border-radius:10px;display:none}
/* ---------- TV extras ---------- */
body.pre #bar,body.pre #cbar{opacity:0!important}
#lt{position:absolute;left:0;top:1540px;width:3840px;height:300px;pointer-events:none;overflow:hidden}
#ltin{position:absolute;left:0;top:300px;width:100%;height:300px;display:flex;justify-content:center;transition:transform .5s cubic-bezier(.22,1,.36,1)}

body.compact #lt{top:1650px}
.ltc{margin-top:30px;height:240px;display:flex;align-items:center;gap:44px;padding:0 70px 0 56px;background:linear-gradient(90deg,rgba(14,16,26,.96),rgba(30,32,44,.94));border-radius:22px;box-shadow:0 14px 36px rgba(0,0,0,.5);position:relative;overflow:hidden;white-space:nowrap}
.ltc .acc{position:absolute;left:0;top:0;bottom:0;width:16px}

.ltc .tg{display:inline-block;font-weight:700;font-size:40px;letter-spacing:3px;padding:6px 20px 2px;border-radius:8px;background:rgb(240,190,40);color:rgb(20,16,6)}
.ltc .tg.red{background:rgb(215,30,45);color:#fff}
.ltc .tg.blue{background:rgb(60,160,255);color:#fff}
.ltc .h1{font-weight:700;font-size:92px;line-height:1;margin-top:14px;display:flex;align-items:center;gap:16px}
.ltc .h2{font-weight:600;font-size:46px;color:rgb(200,204,216);margin-top:12px}
.ltc .ball{position:relative;top:0;flex:none}
.ltc .sum{margin-left:30px;color:rgb(246,200,60)}
#fh{position:absolute;left:3350px;top:1772px;height:62px;padding:0 30px;display:none;align-items:center;font-weight:700;font-size:46px;letter-spacing:3px;background:rgb(246,140,30);color:#fff;border-radius:12px 12px 0 0;padding-top:4px;box-sizing:border-box;animation:fhp 1s infinite}

@keyframes fhp{50%{background:rgb(215,30,45)}}
#win{position:absolute;left:2230px;top:1760px;width:1100px;height:74px;display:none;align-items:center;gap:16px;background:rgba(8,10,18,.82);border-radius:12px 12px 0 0;padding:0 22px;box-sizing:border-box;font-weight:700;font-size:44px}

body.lton #win,body.lton #fh,body.fson #win{opacity:0}
body.compact #win,body.compact #fh{top:1898px}
#fs{position:absolute;left:420px;top:110px;width:3000px;height:1400px;opacity:0;transition:opacity .6s;pointer-events:none}
#fs.on{opacity:1}
#fsin{position:absolute;left:0;top:0;width:100%;height:100%;background:linear-gradient(160deg,rgba(12,14,24,.95),rgba(30,32,46,.93));border-radius:36px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
